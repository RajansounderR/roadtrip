<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Life with Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1420;
    --dusk:#2c1a3a;
    --amber:#ffb35c;
    --rose:#e8734f;
    --cream:#f7ecd9;
    --line:#f7ecd9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'DM Sans', sans-serif;
    background:var(--ink);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    background-image:
      linear-gradient(to bottom, rgba(20,12,28,0.15) 0%, rgba(20,12,28,0.25) 45%, rgba(15,9,20,0.92) 100%),
      url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1920&q=80');
    background-size:cover;
    background-position:center 60%;
  }

  /* eyebrow */
  .eyebrow{
    position:absolute;
    top:36px; left:0; right:0;
    text-align:center;
    color:var(--cream);
    letter-spacing:0.35em;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    opacity:0.75;
  }

  .title-wrap{
    position:absolute;
    top:70px; left:0; right:0;
    text-align:center;
    padding:0 20px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 7vw, 64px);
    color:var(--cream);
    margin:0;
    letter-spacing:0.02em;
    text-shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  h1 span{ color:var(--amber); }
  .subtitle{
    margin-top:10px;
    color:var(--cream);
    opacity:0.8;
    font-size:14px;
    letter-spacing:0.04em;
  }

  /* animated dashed road-line divider — the signature element */
  .roadline{
    position:absolute;
    top:158px; left:50%;
    transform:translateX(-50%);
    width:min(70%, 460px);
    height:6px;
    overflow:hidden;
  }
  .roadline::before{
    content:'';
    position:absolute;
    top:2px; left:0;
    width:200%;
    height:2px;
    background-image:repeating-linear-gradient(to right, var(--amber) 0 26px, transparent 26px 46px);
    animation:drive 1.1s linear infinite;
  }
  @keyframes drive{
    from{ transform:translateX(0); }
    to{ transform:translateX(-46px); }
  }

  /* control console */
  .console{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:28px 24px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .track-info{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--cream);
  }
  .track-info .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--rose);
  }
  .track-info .dot.live{
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }
  #now-playing{
    font-size:13px;
    letter-spacing:0.03em;
    opacity:0.85;
    max-width:70vw;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .controls-row{
    display:flex;
    align-items:center;
    gap:22px;
  }
  .ctrl-btn{
    background:transparent;
    border:none;
    color:var(--cream);
    cursor:pointer;
    opacity:0.75;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  .ctrl-btn:hover{ opacity:1; transform:translateY(-1px); }
  .ctrl-btn svg{ width:22px; height:22px; }

  #play-toggle{
    width:64px; height:64px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--amber), var(--rose));
    box-shadow:0 8px 28px rgba(232,115,79,0.45), inset 0 1px 1px rgba(255,255,255,0.4);
    opacity:1;
  }
  #play-toggle svg{ width:26px; height:26px; fill:var(--ink); }
  #play-toggle:hover{ transform:translateY(-2px) scale(1.03); }

  .volume-row{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--cream);
    opacity:0.7;
  }
  input[type="range"]{
    -webkit-appearance:none;
    width:120px;
    height:3px;
    border-radius:2px;
    background:rgba(247,236,217,0.3);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px; height:12px;
    border-radius:50%;
    background:var(--cream);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:12px; height:12px;
    border-radius:50%;
    background:var(--cream);
    border:none;
    cursor:pointer;
  }

  .hint{
    color:var(--cream);
    opacity:0.55;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-align:center;
  }

  #yt-player{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  @media (prefers-reduced-motion: reduce){
    .roadline::before{ animation:none; }
    .track-info .dot.live{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow">Road Trip Mix</div>
  <div class="title-wrap">
    <h1>Tamil<span>Hits</span></h1>
    <div class="subtitle">windows down · volume up · destination unknown</div>
  </div>
  <div class="roadline"></div>

  <div class="console">
    <div class="track-info">
      <span class="dot" id="live-dot"></span>
      <span id="now-playing">Tap play to start the drive</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="prev-btn" title="Previous track" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button id="play-toggle" title="Play / Pause" aria-label="Play or pause">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>

      <button class="ctrl-btn" id="next-btn" title="Next track" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
      <input type="range" id="volume" min="0" max="100" value="70">
    </div>

    <div class="hint">plays on loop in the background</div>
  </div>
</div>

<div id="yt-player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const VIDEO_ID = 'oO7BTy0F2T4';
  let player;
  let isReady = false;
  let isPlaying = false;

  const playToggle = document.getElementById('play-toggle');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');
  const nowPlaying = document.getElementById('now-playing');
  const liveDot = document.getElementById('live-dot');
  const volumeSlider = document.getElementById('volume');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  // prev/next just restart the single track since there's no playlist
  prevBtn.style.display = 'none';
  nextBtn.style.display = 'none';

  function onYouTubeIframeAPIReady(){
    player = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0,
        controls: 0,
        loop: 1,
        playlist: VIDEO_ID,
        playsinline: 1,
        rel: 0
      },
      events: {
        onReady: onPlayerReady,
        onStateChange: onPlayerStateChange,
        onError: onPlayerError
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function onPlayerReady(){
    isReady = true;
    player.setVolume(70);
    updateNowPlaying();
  }

  let retried = false;
  function onPlayerError(e){
    if(e.data === 153 && !retried){
      retried = true;
      nowPlaying.textContent = 'Reconnecting…';
      setTimeout(() => { player.loadVideoById(VIDEO_ID); }, 400);
      return;
    }
    nowPlaying.textContent = 'Could not load this video (code ' + e.data + ')';
  }

  function onPlayerStateChange(e){
    if(e.data === YT.PlayerState.PLAYING){
      isPlaying = true;
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      liveDot.classList.add('live');
      updateNowPlaying();
    } else if(e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED){
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      liveDot.classList.remove('live');
    } else if(e.data === YT.PlayerState.CUED){
      updateNowPlaying();
    }
  }

  function updateNowPlaying(){
    try{
      const data = player.getVideoData();
      if(data && data.title){
        nowPlaying.textContent = data.title;
      }
    }catch(err){}
  }

  playToggle.addEventListener('click', () => {
    if(!isReady) return;
    if(isPlaying){
      player.pauseVideo();
    }else{
      player.playVideo();
    }
  });

  nextBtn.addEventListener('click', () => { if(isReady) player.seekTo(0); });
  prevBtn.addEventListener('click', () => { if(isReady) player.seekTo(0); });

  volumeSlider.addEventListener('input', (e) => {
    if(isReady) player.setVolume(Number(e.target.value));
  });
</script>

</body>
</html>
